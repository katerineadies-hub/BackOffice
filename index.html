<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackOffice - Tesorería</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-blue-900 p-4 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Bold Group - Dashboard</h1>
            <div class="space-x-4">
                <button onclick="showTab('dashboard')" class="hover:text-blue-300">Resumen Cuentas</button>
                <button onclick="showTab('financial')" class="hover:text-blue-300 font-bold underline">Financial Position</button>
            </div>
        </div>
    </nav>

    <div id="dashboard" class="tab-content hidden container mx-auto mt-10 p-6">
        <h2 class="text-2xl font-bold mb-6">Resumen de Tesorería</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                <h3 class="text-gray-500">Total Pendiente</h3>
                <p class="text-3xl font-bold">$12,450</p>
            </div>
        </div>
    </div>

    <div id="financial" class="tab-content container mx-auto mt-10 p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Financial Position - Análisis Consolidado</h2>
            <div class="text-sm text-gray-500 italic">Datos actualizados vía Colab</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-purple-600">
                <h3 class="font-bold text-lg text-purple-900">Bold CF</h3>
                <div id="data-bold-cf" class="mt-4 text-2xl font-mono">Cargando...</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-600">
                <h3 class="font-bold text-lg text-blue-900">Bold SAS</h3>
                <div id="data-bold-sas" class="mt-4 text-2xl font-mono">Cargando...</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-red-600">
                <h3 class="font-bold text-lg text-red-900">Bold Perú</h3>
                <div id="data-bold-peru" class="mt-4 text-2xl font-mono">Cargando...</div>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow">
            <p class="text-gray-600">Aquí puedes incrustar gráficos de tu análisis de Colab.</p>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }
        // Mostrar Financial por defecto ahora que la estamos creando
        showTab('financial');
    </script>
</body>
</html>
