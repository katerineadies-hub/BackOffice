name: Actualización Automática BI Bold

on:
  schedule:
    # 7:00 AM Colombia = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install pandas gspread google-auth

      - name: Ejecutar Análisis BI
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: python procesar_finanzas.py

      - name: Subir cambios a la Web
        run: |
          git config --global user.name "Bold BI Bot"
          git config --global user.email "bot@bold.co"
          # Agregamos tanto el archivo actual como la carpeta de historial
          git add financial_data.json history/
          git commit -m "📊 Actualización programada 7:00 AM: Posición Financiera" || exit 0
          git push
