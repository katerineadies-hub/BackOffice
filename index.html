<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Bold</title>
    <link rel="stylesheet" href="estilos.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="dashboard-layout">
        
        <aside class="sidebar">
            <div class="logo">bold</div>
            
            <nav class="menu-navegacion">
                <div class="grupo-menu">
                    <span class="titulo-grupo">Cuentas del comercio</span>
                    <ul>
                        <li><a href="#"><i class='bx bx-search-alt'></i> Buscar cuentas</a></li>
                    </ul>
                </div>

                <div class="grupo-menu">
                    <span class="titulo-grupo">Clientes</span>
                    <ul>
                        <li><a href="#"><i class='bx bx-search-alt'></i> Buscar clientes</a></li>
                    </ul>
                </div>

                <div class="grupo-menu">
                    <span class="titulo-grupo">Comercios</span>
                    <ul>
                        <li class="activo"><a href="#"><i class='bx bx-search-alt'></i> Búsqueda</a></li>
                        <li><a href="#"><i class='bx bx-credit-card-front'></i> Payouts</a></li>
                        <li><a href="#"><i class='bx bx-devices'></i> Terminales</a></li>
                    </ul>
                </div>

                <div class="grupo-menu">
                    <span class="titulo-grupo">Pagos</span>
                    <ul>
                        <li><a href="#"><i class='bx bx-dollar-circle'></i> Transacciones</a></li>
                        <li><a href="#"><i class='bx bx-shield-quarter'></i> Disputas</a></li>
                    </ul>
                </div>
            </nav>
        </aside>

        <main class="contenido-principal">
            <div class="cabecera-seccion">
                <a href="#" class="enlace-atras"><i class='bx bx-chevron-left'></i> Búsqueda</a>
                <h1>Búsqueda avanzada de comercios</h1>
                <p>Ingresa los datos del comercio que estás buscando...</p>
            </div>
        </main>

    </div>

</body>
</html>
