<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackOffice - Tesorería</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-blue-800 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-xl font-bold">Sistema de Cuentas por Pagar</h1>
            <span>Bienvenida, Katerine</span>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Tarjetas de Resumen -->
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-medium">Pendientes de Pago</h3>
                <p class="text-3xl font-bold text-gray-800">$12,450.00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-yellow-500">
                <h3 class="text-gray-500 text-sm font-medium">Vencen Hoy</h3>
                <p class="text-3xl font-bold text-gray-800">5 facturas</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-medium">Pagado este mes</h3>
                <p class="text-3xl font-bold text-gray-800">$45,200.00</p>
            </div>
        </div>

        <div class="mt-10 bg-white rounded-lg shadow-md overflow-hidden">
            <div class="bg-gray-50 p-4 border-b">
                <h2 class="font-bold text-gray-700">Listado de Proveedores</h2>
            </div>
            <table class="w-full text-left">
                <thead class="bg-gray-100 text-gray-600 text-sm uppercase">
                    <tr>
                        <th class="p-4">Proveedor</th>
                        <th class="p-4">Vencimiento</th>
                        <th class="p-4">Estado</th>
                    </tr>
                </thead>
                <tbody class="divide-y">
                    <tr>
                        <td class="p-4 font-medium">Suministros Globales S.A.</td>
                        <td class="p-4">15 Mayo, 2026</td>
                        <td class="p-4"><span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs">Pendiente</span></td>
                    </tr>
                    <tr>
                        <td class="p-4 font-medium">Servicios Eléctricos XYZ</td>
                        <td class="p-4">10 Mayo, 2026</td>
                        <td class="p-4"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">Pagado</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
