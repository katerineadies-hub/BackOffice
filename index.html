<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackOffice Bold - Centro de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librerías de Exportación -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 font-sans">
    
    <!-- BARRA DE NAVEGACIÓN PRINCIPAL -->
    <nav class="bg-[#001529] text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <!-- LOGO Y TÍTULO -->
                <div class="flex items-center gap-3">
                    <img src="logo.png" alt="Bold" class="h-10 w-10 object-contain">
                    <h1 class="text-sm md:text-lg font-bold tracking-tight uppercase">Bold Group <span class="font-light text-blue-400">| BackOffice</span></h1>
                </div>

                <!-- MENÚ DE MÓDULOS (BOTONES) -->
                <div class="hidden md:flex items-center gap-2">
                    <button onclick="showModule('financial')" id="btn-financial" class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-blue-600 text-white shadow-lg">
                        Financial Position
                    </button>
                    <!-- Espacio para nuevos botones -->
                    <button onclick="showModule('otros')" id="btn-otros" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-300 hover:bg-slate-800">
                        Otros Módulos
                    </button>
                </div>

                <!-- INDICADOR DE ACTUALIZACIÓN -->
                <div class="text-[10px] bg-blue-500/20 px-3 py-1 rounded-full border border-blue-500/30">
                    Auto-Update: 9:00 AM
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container mx-auto mt-8 p-4">

        <!-- MÓDULO 1: FINANCIAL POSITION (TU DASHBOARD ACTUAL) -->
        <section id="module-financial" class="module-content">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
                <div>
                    <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Financial Position BackOffice</h2>
                    <div class="flex items-center gap-4">
                        <p class="text-slate-500 italic text-sm">Gestión de activos y variaciones diarias</p>
                        <input type="date" id="datePicker" class="text-slate-900 text-xs rounded px-2 py-1 border border-slate-300 outline-none">
                    </div>
                </div>
                <!-- BOTONES DE EXPORTACIÓN -->
                <div class="flex gap-2">
                    <button onclick="exportarExcel()" class="bg-[#1D6F42] hover:bg-[#155231] text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-all">Excel</button>
                    <button onclick="exportarPDF()" class="bg-[#A11C1C] hover:bg-[#7D1616] text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-all">PDF</button>
                </div>
            </div>

            <!-- GRID DE DATOS -->
            <div id="dashboard-grid" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Los datos se inyectan aquí -->
            </div>
        </section>

        <!-- MÓDULO 2: ESPACIO PARA FUTUROS DESARROLLOS -->
        <section id="module-otros" class="module-content hidden">
            <div class="bg-white p-10 rounded-2xl shadow-sm border border-slate-200 text-center">
                <h2 class="text-xl font-bold text-slate-400">Próximamente</h2>
                <p class="text-slate-400 mt-2">Este espacio está reservado para nuevos módulos de Tesorería o BI.</p>
            </div>
        </section>

    </main>

    <script>
        let datosGlobales = null;
        const fmt = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(v);

        // FUNCIÓN PARA CAMBIAR ENTRE MÓDULOS (BOTONES)
        function showModule(moduleId) {
            // Ocultar todos los módulos
            document.querySelectorAll('.module-content').forEach(m => m.classList.add('hidden'));
            // Quitar estilos activos de botones
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
                b.classList.add('text-slate-300');
            });

            // Mostrar módulo seleccionado
            document.getElementById(`module-${moduleId}`).classList.remove('hidden');
            // Estilo activo al botón
            const activeBtn = document.getElementById(`btn-${moduleId}`);
            activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-lg');
            activeBtn.classList.remove('text-slate-300');
        }

        // LÓGICA DE CARGA DE DATOS (Módulo Financial)
        async function cargarBI(fecha = null) {
            try {
                const url = fecha ? `history/data_${fecha}.json` : 'financial_data.json';
                const res = await fetch(url + '?v=' + Date.now());
                if(!res.ok) throw new Error("No hay datos disponibles.");
                datosGlobales = await res.json();
                renderizarDashboard();
            } catch (e) { alert(e.message); }
        }

        function renderizarDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = '';
            Object.keys(datosGlobales).forEach(empresa => {
                const info = datosGlobales[empresa];
                const colorClase = empresa === 'Bold_CF' ? 'purple' : (empresa === 'Bold_SAS' ? 'blue' : 'red');
                grid.innerHTML += `
                    <div class="flex flex-col gap-4">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-${colorClase}-600">
                            <h3 class="text-${colorClase}-900 font-bold uppercase text-xs tracking-widest">${empresa.replace('_', ' ')}</h3>
                            <div class="text-3xl font-black mt-2 text-slate-900">${fmt(info.saldo_actual)}</div>
                        </div>
                        <div class="flex flex-col gap-2">
                            ${info.bancos.map(b => {
                                const esPositivo = b.variacion >= 0;
                                return `
                                    <div class="bg-white px-4 py-3 rounded-xl border border-slate-200 flex justify-between items-center">
                                        <div class="flex flex-col">
                                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">${b.nombre}</span>
                                            <span class="text-sm font-bold text-slate-700">${fmt(b.saldo)}</span>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-[11px] font-black ${esPositivo ? 'text-green-600' : 'text-red-600'}">
                                                ${esPositivo ? '▲' : '▼'} ${Math.abs(b.variacion).toFixed(1)}%
                                            </span>
                                        </div>
                                    </div>`;
                            }).join('')}
                        </div>
                    </div>`;
            });
        }

        // LÓGICA DE EXPORTACIÓN
        function prepararTabla() {
            const filas = [];
            Object.keys(datosGlobales).forEach(empresa => {
                datosGlobales[empresa].bancos.forEach(b => {
                    filas.push({ Empresa: empresa.replace('_', ' '), Banco: b.nombre, Saldo: b.saldo, Variacion: b.variacion.toFixed(2) + '%' });
                });
            });
            return filas;
        }

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(prepararTabla());
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Reporte");
            XLSX.writeFile(wb, "Financial_Position.xlsx");
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Financial Position BackOffice", 14, 15);
            doc.autoTable({ head: [['Empresa', 'Banco', 'Saldo', 'Var %']], body: prepararTabla().map(obj => Object.values(obj)), startY: 25 });
            doc.save("Reporte_Bold.pdf");
        }

        document.getElementById('datePicker').addEventListener('change', (e) => cargarBI(e.target.value));
        cargarBI();
    </script>
</body>
</html>
