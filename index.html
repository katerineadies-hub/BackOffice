<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Position BackOffice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librerías de Exportación -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 font-sans">
    <nav class="bg-[#001529] p-4 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <!-- LOGO OFICIAL BOLD -->
            <div class="flex items-center gap-3">
                <img src="image_649b21.png" alt="Bold Logo" class="h-10 w-10 object-contain">
                <h1 class="text-lg font-bold tracking-tight uppercase">Bold Group <span class="font-light text-blue-400">| Tesorería</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <input type="date" id="datePicker" class="text-slate-900 text-xs rounded px-2 py-1 border-none outline-none">
                <div class="text-xs bg-blue-500/20 px-3 py-1 rounded-full border border-blue-500/30">Auto-Update: 8:00 AM</div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
            <div>
                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Financial Position BackOffice</h2>
                <p class="text-slate-500 italic text-sm">Gestión de activos y variaciones diarias por entidad</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportarExcel()" class="bg-[#1D6F42] hover:bg-[#155231] text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-sm transition-all">
                    Excel
                </button>
                <button onclick="exportarPDF()" class="bg-[#A11C1C] hover:bg-[#7D1616] text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-sm transition-all">
                    PDF
                </button>
            </div>
        </div>

        <div id="dashboard-grid" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Inyección de datos con variaciones y flechas -->
        </div>
    </div>

    <script>
        let datosGlobales = null;
        const fmt = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(v);

        async function cargarBI(fecha = null) {
            try {
                const url = fecha ? `history/data_${fecha}.json` : 'financial_data.json';
                const res = await fetch(url + '?v=' + Date.now());
                if(!res.ok) throw new Error("No hay datos disponibles para la fecha seleccionada.");
                
                datosGlobales = await res.json();
                renderizarDashboard();
            } catch (e) { 
                alert(e.message);
            }
        }

        function renderizarDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = '';

            Object.keys(datosGlobales).forEach(empresa => {
                const info = datosGlobales[empresa];
                const colorClase = empresa === 'Bold_CF' ? 'purple' : (empresa === 'Bold_SAS' ? 'blue' : 'red');
                
                const card = `
                    <div class="flex flex-col gap-4">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-${colorClase}-600">
                            <h3 class="text-${colorClase}-900 font-bold uppercase text-xs tracking-widest">${empresa.replace('_', ' ')}</h3>
                            <div class="text-3xl font-black mt-2 text-slate-900">${fmt(info.saldo_actual)}</div>
                        </div>
                        <div class="flex flex-col gap-2">
                            ${info.bancos.map(b => {
                                const esPositivo = b.variacion >= 0;
                                const colorVar = esPositivo ? 'text-green-600' : 'text-red-600';
                                const flecha = esPositivo ? '▲' : '▼';
                                
                                return `
                                    <div class="bg-white px-4 py-3 rounded-xl border border-slate-200 flex justify-between items-center hover:border-${colorClase}-300 transition-colors">
                                        <div class="flex flex-col">
                                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">${b.nombre}</span>
                                            <span class="text-sm font-bold text-slate-700">${fmt(b.saldo)}</span>
                                        </div>
                                        <div class="text-right flex flex-col">
                                            <span class="text-[11px] font-black ${colorVar}">
                                                ${flecha} ${Math.abs(b.variacion).toFixed(1)}%
                                            </span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function prepararTabla() {
            const filas = [];
            Object.keys(datosGlobales).forEach(empresa => {
                datosGlobales[empresa].bancos.forEach(b => {
                    filas.push({
                        Empresa: empresa.replace('_', ' '),
                        Banco: b.nombre,
                        Saldo: b.saldo,
                        Variacion: b.variacion.toFixed(2) + '%'
                    });
                });
            });
            return filas;
        }

        function exportarExcel() {
            const data = prepararTabla();
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Reporte");
            XLSX.writeFile(wb, `Financial_Position_${new Date().toLocaleDateString()}.xlsx`);
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text("Financial Position BackOffice", 14, 15);
            
            const tableData = prepararTabla().map(obj => Object.values(obj));
            doc.autoTable({
                head: [['Empresa', 'Entidad/Banco', 'Saldo (USD)', 'Var %']],
                body: tableData,
                startY: 25,
                headStyles: { fillColor: [0, 21, 41] } 
            });
            doc.save("Financial_Position_Report.pdf");
        }

        document.getElementById('datePicker').addEventListener('change', (e) => cargarBI(e.target.value));
        cargarBI();
    </script>
</body>
</html>
