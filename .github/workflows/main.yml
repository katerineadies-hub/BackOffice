name: Actualización Automática BI Bold

on:
  schedule:
    # Corre a las 5:00 AM y 3:00 PM hora Colombia
    - cron: '0 10,20 * * *'
  workflow_dispatch: # Permite ejecución manual instantánea

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          # Añadimos openpyxl para poder leer archivos Excel nativos (.xlsx)
          pip install pandas gspread google-auth openpyxl

      - name: Ejecutar Análisis BI
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: python procesar_finanzas.py

      - name: Subir cambios a la Web
        run: |
          git config --global user.name "Bold BI Bot"
          git config --global user.email "bot@bold.co"
          # Guardamos los JSON de datos e historial en el repositorio
          git add financial_data.json history/
          git commit -m "🏛️ Motor Maya: Extracción CUD y saldos actualizada" || exit 0
          git push
