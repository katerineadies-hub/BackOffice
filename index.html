<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Bold - Detalle Bancario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <nav class="bg-[#001529] p-4 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-tight">BOLD GROUP <span class="font-light text-blue-400">| TESORERÍA</span></h1>
            <div class="text-xs bg-blue-500/20 px-3 py-1 rounded-full border border-blue-500/30">Auto-Update: 8:00 AM</div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4">
        <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Posición Financiera Detallada</h2>
        <p class="text-slate-500 mb-8">Saldos por entidad y desglose de cuentas bancarias</p>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Sección Bold CF -->
            <div class="space-y-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-purple-600">
                    <h3 class="text-purple-900 font-bold">BOLD CF</h3>
                    <div id="total-Bold_CF" class="text-3xl font-black mt-2 text-slate-900">$0.00</div>
                </div>
                <div id="list-Bold_CF" class="space-y-2"></div>
            </div>

            <!-- Sección Bold SAS -->
            <div class="space-y-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-blue-600">
                    <h3 class="text-blue-900 font-bold">BOLD SAS</h3>
                    <div id="total-Bold_SAS" class="text-3xl font-black mt-2 text-slate-900">$0.00</div>
                </div>
                <div id="list-Bold_SAS" class="space-y-2"></div>
            </div>

            <!-- Sección Bold Perú -->
            <div class="space-y-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-red-600">
                    <h3 class="text-red-900 font-bold">BOLD PERÚ</h3>
                    <div id="total-Bold_Peru" class="text-3xl font-black mt-2 text-slate-900">$0.00</div>
                </div>
                <div id="list-Bold_Peru" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        const fmt = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(v);

        async function cargarBI() {
            try {
                const res = await fetch('financial_data.json?v=' + Date.now());
                const data = await res.json();

                Object.keys(data).forEach(empresa => {
                    const info = data[empresa];
                    // Actualizar Total Principal
                    document.getElementById(`total-${empresa}`).innerText = fmt(info.saldo_actual);

                    // Generar lista de bancos
                    const listContainer = document.getElementById(`list-${empresa}`);
                    listContainer.innerHTML = info.bancos.map(b => `
                        <div class="bg-white px-4 py-3 rounded-xl border border-slate-200 flex justify-between items-center hover:shadow-md transition-shadow">
                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">${b.nombre}</p>
                                <p class="text-md font-bold text-slate-700">${fmt(b.saldo)}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-black ${b.variacion >= 0 ? 'text-green-500' : 'text-red-500'}">
                                    ${b.variacion >= 0 ? '▲' : '▼'} ${Math.abs(b.variacion).toFixed(1)}%
                                </span>
                            </div>
                        </div>
                    `).join('');
                });
            } catch (e) { console.error("Error:", e); }
        }

        cargarBI();
    </script>
</body>
</html>
