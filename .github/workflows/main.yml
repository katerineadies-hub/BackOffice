name: Actualización Automática BI Bold

on:
  schedule:
    # Corre dos veces al día: 5:00 AM y 3:00 PM hora Colombia
    - cron: '0 10,20 * * *'
  workflow_dispatch: # Mantenemos la ejecución manual por si necesitas forzarla

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install pandas gspread google-auth

      - name: Ejecutar Análisis BI
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: python procesar_finanzas.py

      - name: Subir cambios a la Web
        run: |
          git config --global user.name "Bold BI Bot"
          git config --global user.email "bot@bold.co"
          # Conservamos intacta la subida de los saldos y de la carpeta history
          git add financial_data.json history/
          git commit -m "📊 Actualización programada (Doble Horario): Posición y CUD" || exit 0
          git push
